name: "ECS: Stage"

on:
  push:
    branches: [stage]
    paths:
      - "deployments/ecs/stage/**"
      - "modules/vpc/**"
      - "modules/kms/**"
      - "modules/security-groups/**"
      - "modules/ecr/**"
      - "modules/alb/**"
      - "modules/ecs-cluster/**"
      - "modules/ecs-service/**"
      - "modules/codedeploy/**"
      - "modules/cicd/**"
      - "modules/rds/**"
      - "modules/bastion/**"
      - "modules/cloudtrail/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    with:
      working_directory: deployments/ecs/stage
      environment: stage
    secrets:
      AWS_ROLE_ARN: ${{ secrets.STAGE_TF_AWS_ROLE_ARN }}
