name: "ECS: Stage"

on:
  push:
    branches: [stage]
    paths:
      - "deployments/ecs/stage/**"
      - "modules/vpc/**"
      - "modules/kms/**"
      - "modules/security-groups/**"
      - "modules/ecr/**"
      - "modules/alb/**"
      - "modules/ecs-cluster/**"
      - "modules/ecs-service/**"
      - "modules/codedeploy/**"
      - "modules/cicd/**"
      - "modules/rds/**"
      - "modules/bastion/**"
      - "modules/cloudtrail/**"
  pull_request:
    branches: [stage]
    paths:
      - "deployments/ecs/stage/**"
      - "modules/**"
  workflow_dispatch:

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    with:
      working_directory: deployments/ecs/stage
      environment: stage
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
