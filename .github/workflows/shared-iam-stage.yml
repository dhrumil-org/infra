name: "Shared: IAM Stage"

on:
  push:
    branches: [stage]
    paths:
      - "deployments/shared/iam-stage/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    with:
      working_directory: deployments/shared/iam-stage
      environment: stage
    secrets:
      AWS_ROLE_ARN: ${{ secrets.STAGE_TF_AWS_ROLE_ARN }}
