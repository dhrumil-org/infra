name: "Shared: IAM Stage"

on:
  push:
    branches: [stage]
    paths:
      - "deployments/shared/iam-stage/**"
  pull_request:
    branches: [stage]
    paths:
      - "deployments/shared/iam-stage/**"
  workflow_dispatch:
concurrency:  group: shared-iam-stage  cancel-in-progress: false

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    with:
      working_directory: deployments/shared/iam-stage
      environment: stage
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
