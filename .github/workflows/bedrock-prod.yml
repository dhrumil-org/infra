name: "Bedrock: Prod"

on:
  push:
    branches: [main]
    paths:
      - "deployments/bedrock/prod/**"
      - "modules/bedrock-kb/**"
      - "modules/bedrock-agent/**"
  pull_request:
    branches: [main]
    paths:
      - "deployments/bedrock/prod/**"
      - "modules/bedrock-kb/**"
      - "modules/bedrock-agent/**"
  workflow_dispatch:

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    with:
      working_directory: deployments/bedrock/prod
      environment: prod
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
