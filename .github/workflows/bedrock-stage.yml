name: "Bedrock: Stage"

on:
  push:
    branches: [main]
    paths:
      - "deployments/bedrock/stage/**"
      - "modules/bedrock-kb/**"
      - "modules/bedrock-agent/**"
  pull_request:
    branches: [main]
    paths:
      - "deployments/bedrock/stage/**"
      - "modules/bedrock-kb/**"
      - "modules/bedrock-agent/**"
  workflow_dispatch:

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    with:
      working_directory: deployments/bedrock/stage
      environment: stage
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
