name: "Shared: IAM"

on:
  push:
    branches: [stage]
    paths:
      - "deployments/shared/iam/**"
      - "modules/iam-cicd/**"
  pull_request:
    branches: [stage]
    paths:
      - "deployments/shared/iam/**"
      - "modules/iam-cicd/**"
  workflow_dispatch:

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    with:
      working_directory: deployments/shared/iam
      environment: stage
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
